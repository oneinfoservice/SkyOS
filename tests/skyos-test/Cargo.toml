# Standalone workspace: this crate lives inside the SkyOS repo but is NOT a
# member of the userspace workspace (its clap/serde_json deps are host-only
# and cannot build for the x86_64-sarga target). The empty [workspace] table
# makes it its own workspace root so cargo does not walk up and complain that
# it "believes it's in a workspace when it's not" (cargo bug #14155: exclude
# entries in the parent manifest are not always honored for nested crates).
[workspace]

[package]
name = "skyos-test"
version = "0.1.0"
edition = "2021"
description = "SkyOS Test CLI — run tests, generate reports"

[dependencies]
skyos-test-core = { path = "../skyos-test-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
