# Standalone workspace (see ../skyos-test/Cargo.toml): path-depended on by
# skyos-test, which sits outside the userspace workspace, so this crate must
# also declare its own workspace root.
[workspace]

[package]
name = "skyos-test-core"
version = "0.1.0"
edition = "2021"
description = "SkyOS Test Framework — host-side testing for kernel and userspace logic"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
